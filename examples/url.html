<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>leaflet-kml: load KML by URL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../L.KML.js"></script>
    <style>
        html, body { height: 100%; margin: 0; font: 14px sans-serif; }
        form { display: flex; gap: 8px; padding: 8px; }
        #url { flex: 1; padding: 4px 8px; }
        #status { padding: 0 8px 8px; min-height: 1.2em; }
        #status.error { color: #c00; }
        #map { height: calc(100% - 80px); }
    </style>
</head>
<body>
    <form id="form">
        <input id="url" value="../assets/example1.kml" placeholder="KML or KMZ URL (CORS must be allowed)">
        <button type="submit">Load</button>
    </form>
    <div id="status"></div>
    <div id="map"></div>

    <script>
        // Run via a local server (fetch does not work on file://):
        //   npm start   ->  http://localhost:8000/examples/url.html
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const status = document.getElementById('status');
        let current;

        function setStatus(text, isError) {
            status.textContent = text;
            status.className = isError ? 'error' : '';
        }

        function loadKml(url) {
            if (current) { map.removeLayer(current); }
            setStatus('Loading…');

            current = new L.KML(url);
            current.on('loaded', () => {
                map.fitBounds(current.getBounds());
                setStatus('Loaded: ' + url);
            });
            current.on('error', (e) => setStatus('Error: ' + e.error.message, true));
            map.addLayer(current);
        }

        document.getElementById('form').addEventListener('submit', (e) => {
            e.preventDefault();
            loadKml(document.getElementById('url').value.trim());
        });

        loadKml(document.getElementById('url').value);
    </script>
</body>
</html>
